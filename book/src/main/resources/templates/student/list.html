<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>리스트</h1>
    <table>
      <thead>
        <tr>
          <td>id</td>
          <td>name</td>
          <td>grade</td>
        </tr>
        <tbody>
          <tr th:each="dto : ${list}">     <!-- list 안의 dto마다 한 줄씩 -->
            <td th:text="${dto.id}"></td>    <!-- dto.getName() 값으로 채움 -->
            <td th:text="${dto.name}"></td>
            <td th:text="${dto.grade}"></td>
          </tr>
        </tbody>
      </thead>
    </table>
  </body>
</html>


<!-- ${list}는 컨트롤러가 model.addAttribute("list", …)로 넣은 그 이름이에요.
  Thymeleaf가 서버에서 이 자리를 실제 값으로 바꾼 뒤, 완성된 HTML을 브라우저로 보내요. 브라우저는 받은 걸 보여 주기만 해요 -->
